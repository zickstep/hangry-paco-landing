<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangry Paco | Waitlist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-container">
        <main class="mobile-ui-wrapper">
            
            <!-- The Sticker -->
            <div class="sticker-wrapper">
                <img src="assets/hello-sticker-bg.png" alt="Hello My Name Is" class="sticker-bg">
                <h1 class="paco-text">HANGRY<br>PACO</h1>
            </div>

            <!-- The Waitlist Form -->
            <form action="#" method="POST" class="waitlist-form">
                
                <!-- The Pitch -->
                <div class="pitch-box">
                    <p>A fast-paced party game, your phone is the controller. Type fast or get cut.</p>
                </div>

                <!-- The Email Capture -->
                <div class="input-header">
                    <label class="ui-label" for="email">JOIN WAITLIST</label>
                </div>
                <input type="email" id="email" name="email" placeholder="ENTER YOUR EMAIL" required class="ui-input">

                <button type="submit" class="ui-btn">GET NOTIFIED</button>

            </form>

            <!-- Bottom Studio Logo -->
            <div class="footer-logo">
                <h2 class="studio-logo-text">ZICKSTEPGAMES</h2>
            </div>

        </main>
    </div>
</body>
</html>
