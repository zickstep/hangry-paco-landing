<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangry Paco | Waitlist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-container">
        <main class="mobile-ui-wrapper">
            
            <!-- The Sticker -->
            <div class="sticker-wrapper">
                <img src="assets/hello-sticker-bg.png" alt="Hello My Name Is" class="sticker-bg">
                <h1 class="paco-text">HANGRY<br>PACO</h1>
            </div>

            <!-- The Waitlist Form -->
            <form action="https://formspree.io/f/myezvoly" method="POST" class="waitlist-form">
                
                <!-- The Pitch -->
                <div class="pitch-box">
                    <p>A fast-paced party game, your phone is the controller. Type fast or get cut!<br><br><strong>COMING SOON!</strong></p>
                </div>

                <!-- The Email Capture -->
                <div class="input-header">
                    <label class="ui-label" for="email">JOIN WAITLIST</label>
                </div>
                <input type="email" id="email" name="email" placeholder="ENTER YOUR EMAIL" required class="ui-input">

                <button type="submit" class="ui-btn">GET NOTIFIED</button>

            </form>

            <!-- Bottom Studio Logo & Socials -->
            <div class="footer-logo">
                <!-- Updated Instagram Link -->
                <a href="https://www.instagram.com/hangrypaco?stkn=MXdjcDZ2OGwza3R5aQ%3D%3D&utm_source=qr" target="_blank" class="social-icon">
                    <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                </a>
                <h2 class="studio-logo-text">ZICKSTEPGAMES</h2>
            </div>

        </main>
    </div>
</body>
</html>
